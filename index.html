<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Axemacana</title>
<meta name="description" content="Axemacana. This site is being built.">
<style>
@font-face{font-family:Mulish;src:url(font.woff2) format("woff2");font-weight:200 1000;font-display:swap}
:root{--ink:#202733;--muted:#596373;--line:#e0e4ea;--accent:#3f51b5;--wash:#edf0fa;--footer:#f5f6f8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:17px/1.65 Mulish,system-ui,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column}
::selection{background:var(--wash)}
a{color:var(--accent);text-underline-offset:.2em}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
.wrap{max-width:1100px;margin:auto;padding:0 46px;width:100%}
header{border-bottom:1px solid var(--line)}
header .wrap{padding-top:24px;padding-bottom:24px}
.brand{font-size:20px;font-weight:850;color:var(--ink);text-decoration:none}
.status{background:var(--wash);font-size:14px;padding:13px 0}
.status strong{margin-right:12px}
main{flex:1}
.intro{padding:65px 0 40px}
h1{font-size:clamp(34px,4.8vw,56px);letter-spacing:-.03em;line-height:1.13;margin:0 0 24px;max-width:20ch;font-weight:850;text-wrap:balance}
.lead{font-size:21px;color:var(--muted);max-width:59ch;margin:0}
footer{background:var(--footer);padding:28px 0;margin-top:40px;color:var(--muted);font-size:14px}
@media(max-width:650px){.wrap{padding:0 22px}header .wrap{padding-top:18px;padding-bottom:18px}.intro{padding:42px 0 30px}body{font-size:16px}.lead{font-size:19px}.status strong{display:block}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">Axemacana</a></div></header>
<div class="status" role="status"><div class="wrap"><strong>Under construction</strong>This site is not ready yet.</div></div>
<main id="main"><div class="wrap"><div class="intro">
<h1>Something is being built here.</h1>
<p class="lead">Please come back soon.</p>
</div></div></main>
<footer><div class="wrap">Axemacana · 2026</div></footer>
</body>
</html>
