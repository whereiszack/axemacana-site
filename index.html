<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f1a17">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axe Macana</title>
<meta name="description" content="Axe Macana. A studio for filmmakers and creators. Under construction.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Mulish;src:url(font.woff2) format("woff2");font-weight:200 1000;font-display:swap}
:root{--stone:#0f1a17;--stone-deep:#0b1411;--ink:#e9e6dc;--muted:#a9b8b0;--ochre:#c9a24a;--ochre-deep:#e0bc66;--sea:#7fb5a0;--line:#24342e}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--stone);color:var(--ink);font:17px/1.65 Mulish,system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
::selection{background:var(--ochre);color:var(--stone)}
a{color:var(--ochre);text-underline-offset:.2em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--ochre);outline-offset:4px}
.wrap{width:100%;max-width:880px;margin:0 auto;padding:0 32px}

.reel{height:22px;background:#060c0a;
  background-image:repeating-linear-gradient(90deg,transparent 0 14px,var(--muted) 14px 24px,transparent 24px 38px);
  background-size:38px 8px;background-repeat:repeat-x;background-position:0 7px}

main{flex:1;display:flex;align-items:center}
.hero{padding:72px 0 56px;text-align:center}
.marks{display:block;margin:0 auto 28px;width:min(280px,72%);height:auto}
.status{font-size:13px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--sea);margin:0 0 14px}
h1{font-family:"Cormorant SC",Georgia,serif;font-weight:700;font-size:clamp(52px,11vw,104px);line-height:.95;letter-spacing:.02em;margin:0 0 20px}
.lead{font-size:20px;color:var(--muted);max-width:34ch;margin:0 auto 40px}
.triad{font-family:"Cormorant SC",Georgia,serif;font-weight:700;font-size:clamp(20px,3.4vw,28px);letter-spacing:.08em;color:var(--sea);max-width:none}
.triad span{color:var(--ochre);margin:0 .35em}

form{max-width:460px;margin:0 auto}
label{display:block;font-size:14px;font-weight:800;margin:0 0 8px;text-align:left}
.row{display:flex;gap:0;border:2px solid var(--ochre);background:#16241f}
input[type=email]{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:12px 14px}
input[type=email]::placeholder{color:#7d8c85}
button{border:0;background:var(--ochre);color:var(--stone);font:inherit;font-weight:850;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:0 22px;cursor:pointer}
button:hover{background:var(--ochre-deep)}
.fine{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:left}
.hp{position:absolute;left:-9999px}

footer{border-top:1px solid var(--line);background:var(--stone-deep);font-size:14px;color:var(--muted);padding:22px 0}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.contact{border-top:1px solid var(--line);padding:64px 0 72px}
.contact .wrap{max-width:560px}
.contact h2{font-family:"Cormorant SC",Georgia,serif;font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1;letter-spacing:.02em;margin:0 0 10px;text-align:center}
.contact .lede{color:var(--muted);text-align:center;margin:0 0 32px}
.contact form{max-width:none}
.contact .field{margin:0 0 18px}
.contact .field label{color:var(--sea)}
.contact .field input,.contact .field textarea{width:100%;background:#16241f;border:2px solid var(--line);color:var(--ink);font:inherit;padding:12px 14px;border-radius:0}
.contact .field textarea{min-height:150px;resize:vertical}
.contact .field input:hover,.contact .field textarea:hover{border-color:#3a5249}
.contact .field input:focus,.contact .field textarea:focus{outline:none;border-color:var(--ochre)}
.contact .field input::placeholder{color:#7d8c85}
.check{display:flex!important;gap:12px;align-items:flex-start;font-weight:400!important;font-size:16px!important;line-height:1.45;margin:6px 0 26px!important;cursor:pointer}
.check input{appearance:none;flex:none;width:20px;height:20px;margin:2px 0 0;border:2px solid var(--muted);background:transparent;display:grid;place-content:center;cursor:pointer}
.check input:checked{background:var(--ochre);border-color:var(--ochre)}
.check input:checked::after{content:"";width:10px;height:6px;border:solid var(--stone);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.check small{display:block;color:var(--muted);font-size:14px}
.contact button{padding:14px 26px}
.cstatus{min-height:1.6em;margin:14px 0 0;font-size:15px;color:var(--muted)}
.cstatus.ok{color:var(--sea)}
.cstatus.err{color:#ff8a7a}

@media(max-width:560px){
  .wrap{padding:0 18px}
  .hero{padding:48px 0 40px}
  .lead{font-size:18px}
  .row{flex-direction:column;border-width:2px}
  button{padding:13px 0}
}
</style>
<script>
// GoatCounter: one account for several domains, so prefix paths with the host,
// and count clicks on outbound links and buttons as events.
window.goatcounter={path:function(p){return location.host+p}};
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('a[href]').forEach(function(a){
    if(a.hasAttribute('data-goatcounter-click'))return;
    var h=a.getAttribute('href');
    if(/^(https?:|mailto:|tel:)/.test(h)||/#(contact|sauna-channel|social|films|credits)$/.test(h)){
      a.setAttribute('data-goatcounter-click',location.host+' click: '+h.replace(/^https?:\/\//,''));
      a.setAttribute('data-goatcounter-title',(a.textContent||'').trim().replace(/\s+/g,' ').slice(0,80));
    }
  });
});
</script>
<script data-goatcounter="https://axemacana.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="reel" aria-hidden="true"></div>
<main id="main"><div class="wrap"><div class="hero">

<svg class="marks" viewBox="16 0 222 140" aria-hidden="true" fill="none" stroke="#c9a24a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(140 0) scale(-1 1)">
    <path d="M70 134 V12"/>
    <path d="M70 14 H82 C86 14 90 12 96 8 C104 22 104 44 96 60 C90 52 84 40 82 28 H70"/>
    <path d="M89 20 C94 28 95 38 92 46" stroke-width="2"/>
    <path d="M64 134 H76"/>
  </g>
  <g transform="translate(-48 0)">
    <path d="M132 70 H148 M154 56 L162 84 M168 56 L160 84"/>
    <path d="M180 70 m-18 0 a18 18 0 1 0 36 0 a12 12 0 1 0 -24 0 a6 6 0 1 0 12 0"/>
    <path d="M192 56 L200 84 M206 56 L198 84 M212 70 H228"/>
  </g>
  <g transform="translate(-84 0)">
    <path d="M290 134 V94"/>
    <path d="M282 94 L278 14 Q290 4 302 14 L298 94 Z"/>
    <path d="M290 24 V84"/>
    <path d="M284 134 H296"/>
  </g>
</svg>

<p class="status">Under construction</p>
<h1>Axe Macana</h1>
<p class="lead triad">Scout <span aria-hidden="true">·</span> Forge <span aria-hidden="true">·</span> Claim</p>

<form action="https://app.kit.com/forms/10152137/subscriptions" method="post" accept-charset="UTF-8">
  <label for="email">Hear first when we open</label>
  <div class="row">
    <input id="email" type="email" name="email_address" placeholder="you@studio.com" autocomplete="email" required>
    <button type="submit">Notify me</button>
  </div>
  <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p class="fine">One email when we launch. No spam. Unsubscribe any time.</p>
</form>

</div></div></main>

<section class="contact" id="contact" aria-labelledby="contact-title">
  <div class="wrap">
    <h2 id="contact-title">Send word</h2>
    <p class="lede">A project, a question, or a story to tell? Write to us.</p>
    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="7d783d63-92f8-4aae-b6c3-2d317c190f1e">
      <input type="hidden" name="subject" value="New message from axemacana.com">
      <input type="hidden" name="from_name" value="axemacana.com">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="c-email">Email</label><input id="c-email" type="email" name="email" autocomplete="email" placeholder="you@studio.com" required></div>
      <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message" required></textarea></div>
      <label class="check"><input type="checkbox" name="newsletter" value="Yes, add me to the launch list"><span>Add me to the Axe Macana list<small>One email when we launch. No spam.</small></span></label>
      <button type="submit" id="send-btn">Send message</button>
      <p class="cstatus" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
<script>
(function(){
  var f=document.getElementById('contact-form'); if(!f||!window.fetch) return;
  var st=document.getElementById('form-status'), btn=document.getElementById('send-btn'), busy=false;
  f.addEventListener('submit',function(e){
    e.preventDefault(); if(busy) return; busy=true;
    btn.textContent='Sending…'; st.className='cstatus'; st.textContent='';
    var data=new FormData(f), join=!!data.get('newsletter'); if(!join) data.set('newsletter','No');
    if(join){var k=new FormData(); k.set('email_address',data.get('email')); fetch('https://app.kit.com/forms/10152137/subscriptions',{method:'POST',body:k,mode:'no-cors'}).catch(function(){});}
    fetch(f.action,{method:'POST',body:data,headers:{Accept:'application/json'}})
      .then(function(r){return r.json().then(function(j){return r.ok&&j.success})})
      .then(function(ok){
        if(ok){f.reset(); st.className='cstatus ok'; st.textContent='Message sent. Thank you.';}
        else{st.className='cstatus err'; st.textContent='That did not send. Try again in a minute.';}
      })
      .catch(function(){st.className='cstatus err'; st.textContent='That did not send. Check your connection and try again.';})
      .finally(function(){busy=false; btn.textContent='Send message';});
  });
})();
</script>
<footer><div class="wrap"><span>Axe Macana · 2026</span></div></footer>
</body>
</html>
